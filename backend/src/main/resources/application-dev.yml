spring:
  config:
    import: optional:file:../.env.properties

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

logging:
  level:
    "[org.hibernate.SQL]": DEBUG