spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trainerforge
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate     # scheme is controlled by migrations, not hibernate
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never            # no data.sql, in order to avoid conflicts with flyway

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE 